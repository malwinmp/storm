version: "2.1"

services:
  storm:
    image: ghcr.io/relvacode/storm
    environment:
      STORM_API_KEY: ${STORM_API_KEY:?Set STORM_API_KEY in .env}
      DELUGE_RPC_VERSION: v2
      DELUGE_RPC_HOSTNAME: ${DELUGE_RPC_HOSTNAME:?Set DELUGE_RPC_HOSTNAME in .env}
      DELUGE_RPC_USERNAME: ${DELUGE_RPC_USERNAME:?Set DELUGE_RPC_USERNAME in .env}
      DELUGE_RPC_PASSWORD: ${DELUGE_RPC_PASSWORD:?Set DELUGE_RPC_PASSWORD in .env}
    ports:
      - "127.0.0.1:8221:8221"
